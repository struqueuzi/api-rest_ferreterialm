name: EP3 integración con MySQL

on:
  push:
    branches: [main, ep3-integracion]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: ferreteria
          MYSQL_USER: ferreteria
          MYSQL_PASSWORD: mysql-local-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/ferreteria
      DB_USER: ferreteria
      DB_PASSWORD: mysql-local-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar contexto
        run: ./mvnw -B verify
      - name: Probar la API con MySQL y verificar persistencia
        shell: bash
        run: |
          start() {
            java -jar target/api-rest-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo-mysql > spring.log 2>&1 &
            api_pid=$!
            for segundo in {1..60}; do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/productos > /dev/null; then return; fi
              if ! kill -0 "$api_pid" 2>/dev/null; then cat spring.log; return 1; fi
              sleep 1
            done
            cat spring.log
            return 1
          }
          trap 'kill "${api_pid:-}" 2>/dev/null || true' EXIT
          start
          python3 scripts/verificar_api.py
          kill "$api_pid"
          wait "$api_pid" || true
          start
          auth=$(curl -fsS http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"correo":"vendedor@maestros.cl","clave":"vendedor123"}' | jq -er .token)
          curl -fsS http://127.0.0.1:8080/api/v1/ordenes -H "Authorization: Bearer $auth" | \
            jq -e 'any(.[]; any(.items[]; .productoNombre == "Taladro de verificación"))' > /dev/null
      - name: Guardar el registro de Spring Boot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-ep3
          path: spring.log
